[workspace]
members = ["rasypt-lite-lib", "rasypt-lite-cli", "rasypt-lite-derive"]
resolver = "2"

[workspace.package]
version = "1.0.4"
edition = "2021"
authors = ["Zenas Chen"]

[workspace.dependencies]
# Third-party
aes = "0.9"
assert_matches = "1.5"
async-trait = "0.1"
base64 = "0.22"
cbc = { version = "0.2", features = ["alloc"] }
ghash = "0.6"
hmac = "0.13"
pbkdf2 = "0.13"
rand = "0.10"
serde = { version = "1.0", features = ["default", "derive"] }
serde_json = "1.0"
serde_with = { version = "3.16", features = ["default", "chrono_0_4"] }
serde_yml = "0.0.12"
sha2 = "0.11"
sm3 = "0.5"
sm4 = "0.6"
strum = "0.28"
strum_macros = "0.28"
subtle = "2"
thiserror = "2.0"
unicode-normalization = "0.1"
zeroize = "1.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
