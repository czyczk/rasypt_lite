[package]
name = "rasypt-lite-derive"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Procedural macro for deriving decryption handlers with field-level Jasypt support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/czyczk/rasypt_lite"
homepage = "https://github.com/czyczk/rasypt_lite"
keywords = ["jasypt", "derive", "encryption", "decryption", "secret"]
categories = ["development-tools::procedural-macro-helpers", "cryptography"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
rasypt-lite-lib = { path = "../rasypt-lite-lib", version = "1.1.1" }

[features]
# automatically clear secret fields on Drop. Consumers can opt out by disabling
# this feature; it is enabled by default.
zeroize = []
default = ["zeroize"]
